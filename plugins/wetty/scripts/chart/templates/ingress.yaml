apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-wetty
  annotations:
    kubernetes.io/ingress.class: nginx
    {{- if not .Values.publicAccess }}
    nginx.ingress.kubernetes.io/auth-url: "http://hubble.{{ .Release.Namespace }}.svc.cluster.local:3000/api/auth-workstation/{{ .Values.name }}/"
    {{- end }}
    {{- if and .Values.hostname .Values.publicAccess }}
    nginx.ingress.kubernetes.io/permanent-redirect: "https://{{ .Values.hostname }}/"
    {{- end }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: "/{{ .Release.Namespace }}/wetty/{{ .Values.name }}"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-wetty
                port:
                  number: 3001
