{{- if and .Values.hostname .Values.publicAccess }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-wetty-domain
  annotations:
    kubernetes.io/ingress.class: nginx
    {{- if .Values.tls_issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.tls_issuer }}
    {{- end }}
    {{- if .Values.publish_dns }}
    external-dns.alpha.kubernetes.io/enable: "true"
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.hostname }}
    {{- end }}
spec:
  {{- if .Values.tls_issuer }}
  tls:
    - hosts:
        - {{ .Values.hostname }}
      secretName: {{ .Values.name }}-wetty-tls
  {{- end }}
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}-wetty
                port:
                  number: 3001
{{- end }}
