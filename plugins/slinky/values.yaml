# Chart version applied to slurm-operator-crds, slurm-operator and slurm.
chart_version: 1.2.1

# Operator installation - both are cluster singletons.
install_crds: true
install_operator: true

# Slurm cluster
deploy_cluster: true
cluster_namespace: slurm

# Compute nodes (NodeSet)
worker_replicas: 2
worker_cpu: "2"
worker_memory: 4Gi
worker_gpus: 0

# Controller state-save persistence
storage_class: ""

# Login node (LoginSet)
login_enabled: true
login_service_type: ClusterIP
login_ssh_public_key: ""

# Accounting (slurmdbd + bundled MariaDB)
accounting_enabled: false
accounting_db_password: ""

# Login node user identity (SSSD -> LDAP)
ldap_uri: ""
ldap_search_base: ""
ldap_bind_dn: ""
ldap_bind_password: ""
