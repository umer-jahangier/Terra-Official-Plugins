{{- if and .Values.deploy_cluster .Values.accounting_enabled }}
{{- if not .Values.accounting_db_password }}
{{- fail "accounting_enabled is true but accounting_db_password is empty - set a password for the Slurm accounting database" }}
{{- end }}
---
# Accounting database for slurmdbd.
#
# The names below are not arbitrary: the upstream Slurm chart's default
# accounting.storageConfig points at host "mariadb", database "slurm_acct_db",
# user "slurm", and reads the password from secret "mariadb-password" key
# "password". Matching them exactly means slurmdbd wires itself up with no
# further configuration.
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-password
  namespace: {{ .Values.cluster_namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
stringData:
  password: {{ .Values.accounting_db_password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-mariadb-config
  namespace: {{ .Values.cluster_namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  # Tuning recommended by the Slurm accounting docs.
  # Ref: https://slurm.schedmd.com/accounting.html#slurmdbd-configuration
  slurm.cnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=1024M
    innodb_lock_wait_timeout=900
    innodb_log_file_size=256M
    max_allowed_packet=256M
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: {{ .Values.cluster_namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mariadb
  namespace: {{ .Values.cluster_namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mariadb
          image: docker.io/library/mariadb:11.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            # slurmdbd is the only client; nothing needs the root account.
            - name: MARIADB_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MARIADB_DATABASE
              value: slurm_acct_db
            - name: MARIADB_USER
              value: slurm
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-password
                  key: password
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-mariadb-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.storage_class }}
        storageClassName: {{ .Values.storage_class | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.accounting_db_size | quote }}
{{- end }}
