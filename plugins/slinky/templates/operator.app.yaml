{{- if .Values.install_operator }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Release.Name }}-slinky-operator
  namespace: argocd
  annotations:
    # Wave 1 - after the CRDs are established.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io
    - post-delete-finalizer.argocd.argoproj.io/cleanup
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: slinky
  sources:
    - repoURL: ghcr.io/slinkyproject/charts
      chart: slurm-operator
      targetRevision: {{ .Values.chart_version }}
      helm:
        releaseName: slurm-operator
        values: |
          crds:
            # Managed by the separate slurm-operator-crds Application above.
            enabled: false
          certManager:
            # The chart mints its own self-signed webhook CA, so this install has no
            # external certificate dependency. See ignoreDifferences below.
            enabled: false
  # The chart mints the webhook CA itself with Helm's genCA/genSignedCert.
  # Those helpers have no `lookup` guard, so every ArgoCD render produces a fresh keypair. Left
  # alone that means permanent drift and a webhook pod restart on every refresh. Ignoring the
  # generated material pins the certificate created on first sync (it is valid for 10 years).
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: slurm-operator-webhook-ca
      namespace: slinky
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: slurm-operator-webhook
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: slurm-operator-webhook
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
{{- end }}
