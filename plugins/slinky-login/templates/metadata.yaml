apiVersion: v1
kind: ConfigMap
metadata:
  name: "{{ .Release.Name }}-terra-metadata"
  labels:
    kuiper.juno-innovations.com/chart: "{{ .Release.Name }}-scripts-configmap"
  annotations:
    juno-innovations.com/workload: "Terminal"
data:
  chart: "{{ .Release.Name }}-scripts-configmap"
  description: "Browser terminal onto a Slinky Slurm cluster"
  fields: |
    - name: icon
      default: "https://raw.githubusercontent.com/juno-fx/Terra-Official-Plugins/refs/heads/main/plugins/slinky-login/scripts/assets/logo.png"
    - name: slurmNamespace
      description: "Namespace the Slurm cluster runs in (the Slinky plugin's cluster_namespace)"
      type: string
      required: true
      default: "slurm"
    - name: loginService
      description: "Name of the Slurm login node Service. This depends on the Slinky release name, so there is no safe default - find it with: kubectl get svc -n <slurmNamespace> | grep login. For a Slinky release named <name> it is <name>-slurm-login-slinky."
      type: string
      required: true
    - name: loginPort
      description: "SSH port on the login node Service"
      type: int
      required: true
      default: 22
    - name: registry
      description: "Registry to pull the wetty image from"
      type: string
      required: true
      default: "wettyoss"
    - name: repo
      description: "Repository to pull the wetty image from"
      type: string
      required: true
      default: "wetty"
    - name: tag
      description: "Tag to pull the wetty image from"
      type: string
      required: true
      default: "2.5"
    - name: nginx_registry
      description: "Registry to pull the nginx image from"
      type: string
      required: true
      default: "docker.io"
    - name: nginx_repo
      description: "Repository to pull the nginx image from"
      type: string
      required: true
      default: "nginx"
    - name: nginx_tag
      description: "Tag to pull the nginx image from"
      type: string
      required: true
      default: "1.29.3"
    - name: publicAccess
      description: "Allow public access (disable authentication)"
      type: boolean
      required: true
      default: false
    - name: ingressNamespace
      description: "Namespace of the ingress controller for plugin access"
      type: string
      required: true
      default: "ingress-nginx"
  # This pod is a thin SSH client — the shell, and therefore the environment a
  # user actually works in, lives on the Slurm login node at the other end of the
  # connection. There are no useful client-side variables to suggest; anything
  # affecting the session belongs in the login node's profile instead.
  env_hints: |
    []
