# Kuiper-injected standard values — do not remove
name: slinky-login
user:
group:
cpu: "1"
memory: "1Gi"
cpuLimit: null
memoryLimit: null
idx: 0
guid: 0
puid: 0
host:
pullSecret:
session:
volumeMounts: []
volumes: []
env:
  - name: JUNO
    value: "true"
selector:
plugins: []
_kuiper:

# User-facing fields from templates/metadata.yaml
slurmNamespace: slurm
loginService:   # supplied at launch; no safe default (depends on the Slinky release name)
loginPort: 22
registry: wettyoss
repo: wetty
tag: "2.5"
nginx_registry: docker.io
nginx_repo: nginx
nginx_tag: "1.29.3"
publicAccess: false
ingressNamespace: ingress-nginx
